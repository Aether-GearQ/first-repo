<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>My spotifer (taiwind)</title>
</head>

<body>
    <div class= "bg-gradient-to-b from-slate-500 to-black fixed inset-0 -z-10 "></div>
    <div class="text-white p-4 min-h-screen w-full">
        <!-- ตรงนี้คือส่วนหัว -->
        <div class="flex flex-col items-center">
            <h1 class="text-3xl m-2">My Spotifer</h1>
            <img class="w-[100px] rounded-full" src="https://picsum.photos/200" alt="">
            <button class="cursor-pointer mt-4 bg-slate-500 px-4 py-1.5 rounded-3xl">edit profile</button>
        </div>
        <!-- ส่วนข้อมูลตัวเลข -->
        <div class="flex justify-around">
            <div class=" text-center w-[100px]">
                <p>23</p>
                <p class="text-xs">PLAYLISTS</p>
            </div>
            <div class=" text-center w-[100px]">
                <p>23</p>
                <p class="text-xs">PLAYLISTS</p>
            </div>
            <div class=" text-center w-[100px]">
                <p>23</p>
                <p class="text-xs">PLAYLISTS</p>
            </div>
        </div>
        <hr>
        <!-- ส่วนของเพลย์ลิสท์ -->
        <h1 class="text-xl font-bold">Playlists</h1>
        <div class="flex items-center mt-2">
            <img class="w-[40px] rounded-md" src="https://picsum.photos/200" alt="">
            <div class="w-full ml-2">
                <p>Album name</p>
                <p class="text-xs">100 likes</p>
            </div>
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="flex items-center mt-2">
            <img class="w-[40px] rounded-md" src="https://picsum.photos/200" alt="">
            <div class="w-full ml-2">
                <p>Album name</p>
                <p class="text-xs">100 likes</p>
            </div>
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="flex items-center mt-2">
            <img class="w-[40px] rounded-md" src="https://picsum.photos/200" alt="">
            <div class="w-full ml-2">
                <p>Album name</p>
                <p class="text-xs">100 likes</p>
            </div>
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="flex justify-between items-center mt-2 mb-1">
            <p class="w-full">See all playlists</p>
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <hr>
    </div>
    <!-- ส่วน footer -->
    <div class="flex justify-around bg-slate-900 fixed bottom-0 w-full py-2 text-white">
        <div class="flex flex-col items-center">
            <i class="fa-regular fa-house"></i>
            <p>Home</p>
        </div>
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-magnifying-glass"></i>
            <p>Seach</p>
        </div>
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-book"></i>
            <p>You library</p>
        </div>
    </div>
</body>

</html>
